[project]
name = "arcturus-api"
version = "0.1.0"
description = "Arcturus AI Trading OS — backend API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "yfinance>=0.2.50",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.uv]
# Dev machines run Windows; keep resolution honest about win_amd64 wheel availability.
required-environments = ["sys_platform == 'win32' and platform_machine == 'AMD64'"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arcturus_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "ANN"]
ignore = ["ANN401"]

[tool.mypy]
strict = true
packages = ["arcturus_api"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = "yfinance.*"
ignore_missing_imports = true
