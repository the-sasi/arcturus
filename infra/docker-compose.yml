name: arcturus

services:
  api:
    build: ../services/api
    ports:
      - "8600:8000"
    environment:
      ARCTURUS_ENVIRONMENT: ${ARCTURUS_ENVIRONMENT:-development}
      ARCTURUS_POSTGRES_DSN: postgresql+asyncpg://${POSTGRES_USER:-arcturus}:${POSTGRES_PASSWORD:-arcturus}@timescaledb:5432/${POSTGRES_DB:-arcturus}
      ARCTURUS_REDIS_URL: redis://redis:6379/0
      ARCTURUS_QDRANT_URL: http://qdrant:6333
      ARCTURUS_NEO4J_URL: bolt://neo4j:7687
      ARCTURUS_CORS_ORIGINS: '["http://localhost:3000"]'
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ../apps/web
      args:
        # Baked into the browser bundle; the browser reaches the API via the
        # host-mapped port, not the compose network
        NEXT_PUBLIC_API_URL: http://localhost:8600
    ports:
      - "3000:3000"
    depends_on:
      - api

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-arcturus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-arcturus}
      POSTGRES_DB: ${POSTGRES_DB:-arcturus}
    ports:
      - "5432:5432"
    volumes:
      - timescale-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-arcturus}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-arcturus-dev}
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-arcturus}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-arcturus-dev}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 10s
      retries: 5

volumes:
  timescale-data:
  redis-data:
  qdrant-data:
  neo4j-data:
  minio-data:
