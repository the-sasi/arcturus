# Development override — auto-merged by `docker compose up`.
# Mounts source into the containers and runs both apps in reload mode, so code
# changes apply instantly with NO image rebuild.
#
# Production (ignores this file):
#   docker compose -f docker-compose.yml up -d --build

services:
  api:
    volumes:
      - ../services/api/src:/app/src
      - ../services/api/alembic:/app/alembic
      - ../services/api/alembic.ini:/app/alembic.ini
    environment:
      # Bind mounts on Windows don't emit inotify events — poll instead
      WATCHFILES_FORCE_POLLING: "true"
    command: >
      sh -c "uv run alembic upgrade head &&
             uv run uvicorn arcturus_api.main:app --host 0.0.0.0 --port 8000 --reload"

  web:
    image: node:22-alpine
    build: !reset null
    working_dir: /app
    volumes:
      - ../apps/web:/app
      # Linux-native node_modules live in a named volume, never the Windows host
      - web-node-modules:/app/node_modules
      - web-next-cache:/app/.next
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8600
      WATCHPACK_POLLING: "true"
    command: sh -c "npm install && npm run dev"

volumes:
  web-node-modules:
  web-next-cache:
